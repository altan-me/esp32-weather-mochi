; MOCHI SKY - PlatformIO project (ESP32-C3 + ST7789 240x240)
;
;   pio run -t upload          build + flash
;   pio device monitor         serial logs at 115200
;
; VS Code: install the PlatformIO extension, open this folder, use Upload.

[platformio]
src_dir = weather_mochi

[env:esp32-c3]
platform = espressif32@^8.0.0
board = esp32-c3-devkitm-1   ; esp32-c3-devkitc-02 / esp32dev / etc. for other boards
framework = arduino

monitor_speed = 115200
board_build.partitions = huge_app.csv

; serial logs over the C3's native USB (instead of the UART pins)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    bblanchon/ArduinoJson@^7
